<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f2" />
    <title>Sin conexión - Comeback Golf</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        /* Los colores de la marca, escritos a mano: esta página no carga
           la hoja de la aplicación. Off White, Deep Forest y Acid Lime */
        background: #f8f7f2;
        color: #222d24;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }
      .icon { font-size: 4rem; margin-bottom: 1.5rem; }
      h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.75rem; }
      p { color: #545b52; font-size: 1rem; line-height: 1.6; max-width: 320px; }
      button {
        margin-top: 2rem;
        padding: 0.75rem 1.5rem;
        background: #ddf478;
        color: #222d24;
        border: none;
        border-radius: 1.625rem;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { filter: brightness(0.95); }
    </style>
  </head>
  <body>
    <div class="icon">⛳</div>
    <h1>Sin conexión</h1>
    <p>Comprueba tu conexión a internet e inténtalo de nuevo.</p>
    <button id="retry-button">Reintentar</button>
    <script src="/offline.js"></script>
  </body>
</html>
